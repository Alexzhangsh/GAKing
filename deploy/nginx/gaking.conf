# @ai-generated
# ============================================================
# 金角大王CPS - Nginx 反向代理配置（上传到 /etc/nginx/conf.d/gaking.conf）
# S04 完善：限流 + robots.txt + 跨域 + 超时 + 缓存策略
#
# 部署前必须替换的占位符（用 sed 或手动）：
#   {{API_DOMAIN}}      后端 API 域名，如 api.goldalicorn.com
#   {{ADMIN_DOMAIN}}    管理后台域名，如 admin.goldalicorn.com
#   {{SSL_CERT}}        SSL 证书路径，如 /etc/nginx/ssl/gaking/fullchain.pem
#   {{SSL_KEY}}         SSL 私钥路径，如 /etc/nginx/ssl/gaking/privkey.pem
#   {{ADMIN_ROOT}}      admin 前端静态文件目录，如 /etc/nginx/static/gaking-admin
#
# 替换示例：
#   sed -i 's|{{API_DOMAIN}}|api.goldalicorn.com|g; s|{{ADMIN_DOMAIN}}|admin.goldalicorn.com|g; \
#           s|{{SSL_CERT}}|/etc/nginx/ssl/gaking/fullchain.pem|g; \
#           s|{{SSL_KEY}}|/etc/nginx/ssl/gaking/privkey.pem|g; \
#           s|{{ADMIN_ROOT}}|/etc/nginx/static/gaking-admin|g' /etc/nginx/conf.d/gaking.conf
# ============================================================

# ── 全局限流定义（http 级，需放在 http{} 块内）──
# 注意：若本文件被 include 到 conf.d，limit_req_zone 需在 http 级定义，
# 建议将以下两行放入 /etc/nginx/nginx.conf 的 http{} 块：
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# 若无法修改主配置，可将以下 limit_req_zone 移到本文件顶部（nginx 1.18+ 支持在 server 外定义）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ── 上游后端（Docker 映射端口 3003）──
upstream gaking_backend {
    server 127.0.0.1:3003;
    keepalive 32;
}

# ── HTTP -> HTTPS 跳转（API + Admin）──
server {
    listen 80;
    server_name {{API_DOMAIN}} {{ADMIN_DOMAIN}};

    # ACME 证书验证留通道（如使用 let's encrypt）
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/static/gaking-acme;
        default_type text/plain;
    }

    # 禁止爬虫抓取明文 HTTP
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    return 301 https://$host$request_uri;
}

# ── 后端 API（HTTPS）──
server {
    listen 443 ssl http2;
    server_name {{API_DOMAIN}};

    ssl_certificate     {{SSL_CERT}};
    ssl_certificate_key {{SSL_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:GAKINGSSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 请求体大小（富文本/图片上传兜底，OBS 为主要存储）
    client_max_body_size 20m;

    # 后端反代（限流：API 全局限流 30r/s）
    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://gaking_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 登录接口更严格限流（防暴力破解）
    location ~ ^/api/v1/(auth|admin/auth)/ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://gaking_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # robots.txt（API 域名禁止抓取）
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    access_log /etc/nginx/logs/gaking-api.access.log;
    error_log  /etc/nginx/logs/gaking-api.error.log;
}

# ── 管理后台前端静态站点（HTTPS）──
server {
    listen 443 ssl http2;
    server_name {{ADMIN_DOMAIN}};

    ssl_certificate     {{SSL_CERT}};
    ssl_certificate_key {{SSL_KEY}};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:GAKINGSSL_ADMIN:10m;
    ssl_session_timeout 1d;

    root {{ADMIN_ROOT}};
    index index.html;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的构建产物）
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台 API 代理（admin 前端通过同域 /api/ 访问后端，避免跨域）
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://gaking_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # robots.txt（后台禁止抓取）
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    access_log /etc/nginx/logs/gaking-admin.access.log;
    error_log  /etc/nginx/logs/gaking-admin.error.log;
}
